<script>
// The model data. A small build carries it inline; a big build keeps it in
// its own file next to the page and this is that file's name. Then the page
// itself stays a few hundred kB, which link previews need (LinkedIn stops
// reading at 3 MiB), and the data downloads alongside the map library.
let DATA = /*__DATA__*/;
const _dataFetch = typeof DATA !== "string" ? Promise.resolve(DATA)
  : fetch(DATA).then(r => { if (!r.ok) throw new Error(`${DATA}: ${r.status}`); return r.json(); });

/* ------------------------------------------------------------------ *
 * Cesium loader.
 * Local vendored copy first so the page works with no internet, then
 * the CDN. If both fail, say exactly what to do instead of going blank.
 * ------------------------------------------------------------------ */
const CESIUM_SOURCES = [
  { base: "vendor/Cesium/",
    js: "vendor/Cesium/Cesium.js",
    css: "vendor/Cesium/Widgets/widgets.css",
    name: "local vendored copy" },
  // Same version as the vendored copy. They used to differ (1.145 locally,
  // 1.119 from the CDN), so what worked on localhost broke once deployed.
  { base: "https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/",
    js: "https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js",
    css: "https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css",
    name: "Cesium 1.145 CDN" }
];

function loadCesium() {
  return new Promise((resolve, reject) => {
    const attempt = i => {
      if (i >= CESIUM_SOURCES.length) return reject(new Error("no source worked"));
      const src = CESIUM_SOURCES[i];
      window.CESIUM_BASE_URL = src.base;
      const link = document.createElement("link");
      link.rel = "stylesheet"; link.href = src.css;
      document.head.appendChild(link);
      const s = document.createElement("script");
      s.src = src.js;
      s.onload = () => (typeof Cesium !== "undefined") ? resolve(src) : attempt(i + 1);
      s.onerror = () => attempt(i + 1);
      document.head.appendChild(s);
    };
    attempt(0);
  });
}

function bootFail(title, err) {
  if (err) console.error(err);
  document.getElementById("boot").innerHTML = `<div class="inner">
    <div style="font-size:14px;color:#ffb4a0;margin-bottom:10px">
      ${title || "Could not load the map library"}</div>
    <div style="color:#8b94a0;font-size:11.5px;line-height:1.7">
      No internet, or the Cesium CDN is blocked from here.<br><br>
      If you already vendored Cesium, this page must be served over http.<br>
      Run <code>python serve.py</code> instead of opening the file directly.<br><br>
      To make this page work offline, once, with a connection:<br>
      <code>npm install cesium@1.145.0</code><br>
      then copy <code>node_modules/cesium/Build/Cesium</code><br>
      into <code>vendor/Cesium</code> next to this file.<br><br>
      After that it never needs the network again.
    </div></div>`;
}

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);

// Cesium throws objects that are not Error instances, and String() turns those
// into "[object Object]", which tells you nothing. Dig out something readable.
function describe(e) {
  if (e == null) return "unknown error";
  if (typeof e === "string") return e;
  const parts = [];
  if (e.name) parts.push(e.name);
  if (e.message) parts.push(e.message);
  if (!parts.length && e.toString && e.toString() !== "[object Object]") {
    parts.push(e.toString());
  }
  if (!parts.length) {
    try { parts.push(JSON.stringify(e).slice(0, 400)); } catch (_) {}
  }
  if (e.stack) parts.push("\n\n" + String(e.stack).split("\n").slice(0, 4).join("\n"));
  return parts.join(": ") || "unknown error";
}
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))
  ? "--" : Number(v).toFixed(d);
const pct = v => (v * 100).toFixed(1) + "%";

let viewer, overlayLayer = null, buildingSource = null;
let activeLayer = "shade";
let dayIndex = 0, hourIndex = 0;
let opacity = 1.0;
let playing = false, playTimer = null;
let recMode = false;
let splitMode = false;
let viewer2 = null;
let splitX = 0.5;

}

// DATA2 is the comparison dataset. The viewer tries to load it from
// a relative URL; if it is not present, split mode is silently disabled.
let DATA2 = null;
let cmpState = "loading";   // loading | ready | none
let buildMode = "sun";      // sun | gain | flat
let buildOpacity = 1.0;

const hasFacades = () => !!DATA.has_facades;

// Buildings coloured by how much sun their own walls get. Cool where a wall
// never leaves the shade, warm where it is lit most of the day. Deliberately
// the same ramp as the ground sun-hours layer so the two read together.
const WALL_RAMP = ["#10203f", "#1d3f6e", "#2e6a8e", "#49939a",
                   "#84b78c", "#d3c96b", "#e99a4a", "#c9482f"];

function rampColour(t) {
  const i = Math.max(0, Math.min(WALL_RAMP.length - 1,
    Math.floor(t * WALL_RAMP.length)));
  return WALL_RAMP[i];
}

function buildingValue(b) {
  if (!b.sun) return null;
  const s = b.sun[day().id];
  if (!s) return null;
  return buildMode === "gain" ? s.kwh : s.h;
}

// Colour domain from the data, not from the theoretical maximum.
//
// In a dense city almost every wall is blocked almost all the time, so the
// distribution is squashed against zero with a long thin tail. Scaling the
// ramp to the single sunniest wall in the frame puts every other building in
// the bottom bin and the whole city renders navy. Clipping at the 95th
// percentile spreads the colours across the range that actually exists, and
// the legend says what the top bin means so nothing is hidden.
const _domCache = {};
function buildingMax() {
  const key = buildMode + ":" + day().id;
  if (_domCache[key] !== undefined) return _domCache[key];
  const vals = [];
  for (const b of DATA.buildings) {
    const v = buildingValue(b);
    if (v !== null && v > 0) vals.push(v);
  }
  if (!vals.length) return _domCache[key] = 1;
  vals.sort((a, b) => a - b);
  const p95 = vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.95))];
  return _domCache[key] = (p95 > 0 ? p95 : vals[vals.length - 1]) || 1;
}

const day = () => DATA.days[dayIndex];
const hasSvf = () => DATA.svf !== null && DATA.svf !== undefined;

// The hour with the most park feeling at least 2 C colder: where to start.
function worstStep(s) {
  let best = 0;
  s.steps.forEach((x, i) => { if (x.ha_colder_2 > s.steps[best].ha_colder_2) best = i; });
  return best;
}

function prefetchHeat() {
  if (!isFelt()) return;
  const ws = localWind && WINDHEAT ? WINDHEAT.seasons.find(x => x.id === hseason().id) : null;
  for (const st of (ws ? ws.steps : hseason().steps)) {

      if (_warm.has(u)) continue;
      _warm.add(u);
      const im = new Image();
      im.src = u;
    }
  }
}

function changeColour(v) {
  const L = HEAT.legend.change;
  for (const e of L) if (v >= e.min && v < e.max) return Cesium.Color.fromCssColorString(e.color);
  return Cesium.Color.fromCssColorString(v < 0 ? L[0].color : L[L.length - 1].color);
}

// Columns stand on 10 m squares of the park, height proportional to how much
// colder it feels there than in 2017. One primitive per hour, built once.
function buildColumns(cols) {
  const S = HEAT.columns.section_m * 0.9, k = HEAT.columns.m_per_c;
  const inst = cols.map(([lon, lat, v]) => {
    const h = Math.max(1.5, Math.abs(v) * k);
    return new Cesium.GeometryInstance({
      geometry: Cesium.BoxGeometry.fromDimensions({
        vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
        dimensions: new Cesium.Cartesian3(S, S, h) }),
      modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
        Cesium.Cartesian3.fromDegrees(lon, lat, h / 2)),
      attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(
        changeColour(v).withAlpha(0.9)) },
      id: { heatColumn: true, v }
    });
  });
  return new Cesium.Primitive({
    geometryInstances: inst, asynchronous: false,
    appearance: new Cesium.PerInstanceColorAppearance({ translucent: true, closed: true })
  });
}

function feltColour(u) {
  const L = HEAT.legend.felt;
  for (const e of L) if (u >= e.min && u < e.max) return Cesium.Color.fromCssColorString(e.color);
  return Cesium.Color.fromCssColorString(u < L[0].min ? L[0].color : L[L.length - 1].color);
}

// The felt-temperature 3D heatmap: every 10 m square of the park, coloured by
// how it feels. Height is thermal stress (degrees outside the UTCI comfort
// band) above the mildest ground in the park that day, so the harshest spots
// stand tallest and the mildest lie flat.
function buildFeltHeatmap(halfDegrees) {
  const S = HEAT.columns.section_m * 0.9, k = HEAT.columns.felt_m_per_c;
  const [lo, hi] = HEAT.columns.neutral;
  const base = hseason().felt_base_stress || 0;
  const inst = [];
  HEAT.sections.forEach(([lon, lat], i) => {
    const u = halfDegrees[i] / 2;
    const stress = u < lo ? lo - u : (u > hi ? u - hi : 0);
    const h = Math.max(0.6, (stress - base) * k);
    inst.push(new Cesium.GeometryInstance({
      geometry: Cesium.BoxGeometry.fromDimensions({
        vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
        dimensions: new Cesium.Cartesian3(S, S, h) }),
      modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
        Cesium.Cartesian3.fromDegrees(lon, lat, h / 2)),
      attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(feltColour(u)) },
      id: { heatFelt: true, u }
    }));
  });
  return new Cesium.Primitive({
    geometryInstances: inst, asynchronous: false,
    appearance: new Cesium.PerInstanceColorAppearance({ translucent: false, closed: true })
  });
}

function updateColumns() {
  if (!viewer) return;
  const want = !!HEAT && isFelt() && showCols;
  const scen = isTodayBuild() ? "today" : "y2017";
  const lw = want && feltIsLocal() ? "w" : "";
  const key = !want ? null : activeLayer === "felt"
    ? `felt${lw}:${scen}:${heatSeason}:${heatStep}` : `chg${lw}:${heatSeason}:${heatStep}`;
  for (const [k, p] of colCache) p.show = (k === key);
  if (!want || colCache.has(key)) return;
  const fs = feltStep();
  if (activeLayer === "felt") {
    const vals = fs.felt2 && fs.felt2[scen];
    if (!vals || !HEAT.sections) return;
    colCache.set(key, viewer.scene.primitives.add(buildFeltHeatmap(vals)));
    return;
  }
  const cols = fs.cols;
  if (!cols || !cols.length) return;
  colCache.set(key, viewer.scene.primitives.add(buildColumns(cols)));
}

// Heat colours read best against plain buildings. Wall colouring comes back
// when you leave the heat layers.
let savedBuildMode = null;
function heatBuildings(entering) {
  if (!hasFacades()) return;
  if (entering) { savedBuildMode = buildMode; buildMode = "flat"; }
  else if (savedBuildMode) { buildMode = savedBuildMode; savedBuildMode = null; }
  document.querySelectorAll("#bmode button").forEach(o =>
    o.classList.toggle("on", o.dataset.bm === buildMode));
  recolourBuildings();
}

function pointInRing(pt, ring) {
  const [x, y] = pt;
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function towerFor(b) {
  if (!HEAT || !HEAT.towers || !b.ring) return null;
  return HEAT.towers.find(t => pointInRing(t.lonlat, b.ring)) || null;
}

/* ------------------------------------------------------------------ *
 * Wind, optional. wind/wind.json and the line files come from
 * pipeline/wind_export.py; wind/windheat.json (felt temperature with the
 * local wind) from pipeline/wind_heat.py. The wind layer runs on the heat
 * layers' days and hours, plus "Live now" from Open-Meteo.
 *
 * Nothing is simulated in the browser. A 3D wind simulation was run once
 * per wind direction; the page plays it back. Each line follows the
 * time-mean wind, and light moves along it at the simulated speed, sped up
 * WIND_SPEEDUP times: fast where the wind is fast, slow in the lee.
 * ------------------------------------------------------------------ */
let WIND = null, WINDHEAT = null, windLive = null, windLiveMode = false, windLiveErr = null;
// Phones start with the animation off: it is the heaviest thing on the page.
let windAnim = !(window.matchMedia &&
  matchMedia("(max-width: 760px), (pointer: coarse)").matches);
let windAir = true, localWind = true, windDensity = 1, windThinned = false, windMapChange = false;
// ?full=1 keeps every line, for renders.
const windFull = new URLSearchParams(location.search).get("full") === "1";
const WIND_SPEEDUP = 20;
// Under the moving lines the wind map is a backdrop, not the subject.
const WIND_MAP_ALPHA = 0.55;
const overlayAlpha = () => opacity * (activeLayer === "wind" && windAnim ? WIND_MAP_ALPHA : 1);
const WIND_CAVEAT = "Wind simulated in 3D on 8 m cells (lattice Boltzmann, time-mean), scaled " +
  "to the weather station's wind. Shows where it is windier or calmer, not gusts.";
const isWind = () => activeLayer === "wind";
const isFelt = () => activeLayer === "felt" || activeLayer === "change";
const _windFetch = fetch("wind/wind.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : null).catch(() => null);
const _windHeatFetch = fetch("wind/windheat.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : null).catch(() => null);

async function loadWind() {
  WIND = await _windFetch;
  WINDHEAT = await _windHeatFetch;

}

function setToggle(id, on, onText, offText) {
  $(id).classList.toggle("on", on);
  $(id).textContent = on ? onText : offText;
}

const COMPASS16 = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
                   "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const compass16 = d => COMPASS16[Math.round((((d % 360) + 360) % 360) / 22.5) % 16];

// The heat step with the local wind, when there is one and it is wanted.
function feltStep() {
  if (localWind && WINDHEAT) {
    const s = WINDHEAT.seasons.find(x => x.id === hseason().id);
    const st = s && s.steps.find(x => x.time === hstep().time);
    if (st) return st;
  }
  return hstep();
}
const feltIsLocal = () => feltStep() !== hstep();

function windHeatStep() {
  if (!WINDHEAT) return null;
  const s = WINDHEAT.seasons.find(x => x.id === hseason().id);
  return s ? s.steps.find(x => x.time === hstep().time) || null : null;
}

// Trees are bare from November to April.
const liveSeason = () => { const m = new Date().getMonth(); return (m >= 4 && m <= 9) ? "jun" : "dec"; };

function windNow() {
  if (windLiveMode && windLive) {
    return { dir: windLive.dir, speed: windLive.speed, season: liveSeason(), live: true };
  }
  const ws = windHeatStep();
  return { dir: ws ? ws.wind_dir : 315, speed: ws ? ws.wind_m_s : hstep().wind_m_s,
           season: hseason().id, live: false };
}

// The simulated direction nearest the wind. A run with the trees of the
// wrong season counts as 15 degrees further away: direction matters more.
function windRunFor(scen, season, dir) {
  const pool = WIND.runs.filter(r => r.scenario === scen && r.res_m === 8 && !/small/.test(r.name));
  if (!pool.length) return null;
  const cost = r => Math.abs(((r.dir - dir) % 360 + 540) % 360 - 180) + (r.season === season ? 0 : 15);
  return pool.reduce((a, b) => cost(b) < cost(a) ? b : a);
}
const windScen = () => isTodayBuild() ? "today" : "2017";
const currentWindRun = () => { const w = windNow(); return windRunFor(windScen(), w.season, w.dir); };
// The change map for the direction in view, when both years were run for it.
function currentWindChange() {
  const r = currentWindRun();
  if (!r || !WIND.changes) return null;
  return WIND.changes.find(c => c.dir === r.dir && c.season === r.season) || null;
}

async function fetchLive() {

    "wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms" +
    "&timezone=America%2FNew_York";
  try {

    if (!r.ok) throw new Error("HTTP " + r.status);
    const c = (await r.json()).current;
    windLive = { dir: c.wind_direction_10m, speed: c.wind_speed_10m, gust: c.wind_gusts_10m,
                 ta: c.temperature_2m, rh: c.relative_humidity_2m, time: c.time };
    windLiveErr = null;
  } catch (e) {
    windLiveErr = "Live wind unavailable (" + describe(e) + ")";

}

/* ---------- the line renderer ----------
 * One custom draw command per line file: ribbons a few pixels wide that
 * always face the camera, drawn additively after the buildings, so they glow
 * and hide behind walls. Vertices are one fixed slice of travel time apart,
 * so a light that steps one vertex per tick moves at the local wind speed. */
const WIND_VS = `
in vec3 a_pos;
in vec3 a_next;
in vec4 a_aux;
uniform float u_width;
out float v_side;
out float v_tau;
out float v_k;
out float v_ph;
void main() {
  vec4 p = czm_modelViewProjection * vec4(a_pos, 1.0);
  vec4 q = czm_modelViewProjection * vec4(a_next, 1.0);
  vec2 ps = p.xy / p.w * czm_viewport.zw;
  vec2 qs = q.xy / max(q.w, 1e-6) * czm_viewport.zw;
  vec2 d = qs - ps;
  float L = length(d);
  vec2 dir = L > 1e-6 ? d / L : vec2(1.0, 0.0);
  vec2 nrm = vec2(-dir.y, dir.x);
  p.xy += nrm * a_aux.x * u_width * 2.0 / czm_viewport.zw * p.w;
  gl_Position = p;
  v_side = a_aux.x; v_tau = a_aux.y; v_k = a_aux.z; v_ph = a_aux.w;
}`;
const WIND_FS = `
in float v_side;
in float v_tau;
in float v_k;
in float v_ph;
uniform float u_phase;
uniform float u_period;
uniform float u_speed;
uniform float u_base;
vec3 ramp(float t) {
  vec3 c0 = vec3(0.45, 0.66, 1.0);
  vec3 c1 = vec3(0.78, 0.92, 1.0);
  vec3 c2 = vec3(1.0, 1.0, 1.0);
  vec3 c3 = vec3(1.0, 0.84, 0.42);
  t = clamp(t, 0.0, 1.0);
  if (t < 0.4) return mix(c0, c1, t / 0.4);
  if (t < 0.75) return mix(c1, c2, (t - 0.4) / 0.35);
  return mix(c2, c3, (t - 0.75) / 0.25);
}
void main() {
  float edge = 1.0 - smoothstep(0.25, 1.0, abs(v_side));
  float ph = fract((u_phase - v_tau) / u_period + v_ph);
  float comet = pow(1.0 - ph, 7.0);
  vec3 col = ramp(v_k * u_speed / 12.0);
  float a = (u_base + 0.95 * comet) * edge;
  out_FragColor = vec4(col, a);
}`;

class WindLines {
  constructor(lines, kind, origin, k1m) {
    this.lines = lines; this.kind = kind; this.k1m = k1m;
    this.show = true; this.fraction = 1; this.phase = 0; this.speed = 5;
    this.modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(
      Cesium.Cartesian3.fromDegrees(origin.lon, origin.lat, 0));
    this._cmd = null;
  }
  _build(context) {
    const { n, lens, pts } = this.lines;
    let tot = 0;
    for (let i = 0; i < n; i++) tot += lens[i];
    const nv = tot * 2;
    const pos = new Float32Array(nv * 3), nxt = new Float32Array(nv * 3), aux = new Float32Array(nv * 4);
    const idx = new Uint32Array(Math.max(0, tot - n) * 6);
    this.ends = new Uint32Array(n);
    let v = 0, o = 0, ii = 0, r2 = 0;
    for (let L = 0; L < n; L++) {
      const len = lens[L], ph = Math.random();
      for (let k = 0; k < len; k++) {
        const a = (o + k) * 3;
        const px = pts[a] / 10, py = pts[a + 1] / 10, pz = pts[a + 2] / 10;
        const j = k < len - 1 ? a : a - 3;
        const dx = (pts[j + 3] - pts[j]) / 10, dy = (pts[j + 4] - pts[j + 1]) / 10,
              dz = (pts[j + 5] - pts[j + 2]) / 10;
        const K = Math.hypot(dx, dy, dz) / this.k1m;
        const qx = k < len - 1 ? pts[a + 3] / 10 : px + dx;
        const qy = k < len - 1 ? pts[a + 4] / 10 : py + dy;
        const qz = k < len - 1 ? pts[a + 5] / 10 : pz + dz;
        r2 = Math.max(r2, px * px + py * py + pz * pz);
        for (const side of [-1, 1]) {
          pos[v * 3] = px; pos[v * 3 + 1] = py; pos[v * 3 + 2] = pz;
          nxt[v * 3] = qx; nxt[v * 3 + 1] = qy; nxt[v * 3 + 2] = qz;
          aux[v * 4] = side; aux[v * 4 + 1] = k; aux[v * 4 + 2] = K; aux[v * 4 + 3] = ph;
          v++;
        }
      }
      for (let k = 0; k < len - 1; k++) {
        const b = (o + k) * 2;
        idx[ii++] = b; idx[ii++] = b + 1; idx[ii++] = b + 2;
        idx[ii++] = b + 1; idx[ii++] = b + 3; idx[ii++] = b + 2;
      }
      this.ends[L] = ii;
      o += len;
    }
    const usage = Cesium.BufferUsage.STATIC_DRAW;
    const vb = arr => Cesium.Buffer.createVertexBuffer({ context, typedArray: arr, usage });
    const F = Cesium.ComponentDatatype.FLOAT;
    this._va = new Cesium.VertexArray({
      context,
      indexBuffer: Cesium.Buffer.createIndexBuffer({ context, typedArray: idx, usage,
        indexDatatype: Cesium.IndexDatatype.UNSIGNED_INT }),
      attributes: [
        { index: 0, vertexBuffer: vb(pos), componentsPerAttribute: 3, componentDatatype: F },
        { index: 1, vertexBuffer: vb(nxt), componentsPerAttribute: 3, componentDatatype: F },
        { index: 2, vertexBuffer: vb(aux), componentsPerAttribute: 4, componentDatatype: F }]
    });
    this._sp = Cesium.ShaderProgram.fromCache({ context, vertexShaderSource: WIND_VS,
      fragmentShaderSource: WIND_FS, attributeLocations: { a_pos: 0, a_next: 1, a_aux: 2 } });
    const rs = Cesium.RenderState.fromCache({ depthTest: { enabled: true }, depthMask: false,
      blending: Cesium.BlendingState.ADDITIVE_BLEND, cull: { enabled: false } });
    const self = this, air = this.kind === "air";
    const sphere = new Cesium.BoundingSphere(Cesium.Cartesian3.ZERO, Math.sqrt(r2) + 50);
    this._cmd = new Cesium.DrawCommand({
      modelMatrix: this.modelMatrix, vertexArray: this._va, shaderProgram: this._sp,
      renderState: rs, pass: Cesium.Pass.TRANSLUCENT, primitiveType: Cesium.PrimitiveType.TRIANGLES,
      boundingVolume: Cesium.BoundingSphere.transform(sphere, this.modelMatrix, new Cesium.BoundingSphere()),
      owner: this,
      uniformMap: {
        u_phase: () => self.phase,
        u_period: () => air ? 34.0 : 26.0,
        u_speed: () => self.speed,
        u_base: () => air ? 0.08 : 0.16,
        u_width: () => (air ? 1.9 : 1.5) * (window.devicePixelRatio || 1)
      }
    });
  }
  update(frameState) {
    if (!this.show || !frameState.passes.render || !this.lines.n) return;
    if (!this._cmd) this._build(frameState.context);
    const m = Math.max(1, Math.round(this.lines.n * this.fraction));
    this._cmd.count = this.ends[m - 1];
    if (this._cmd.count > 0) frameState.commandList.push(this._cmd);
  }
  isDestroyed() { return false; }
  destroy() {
    if (this._va) this._va.destroy();
    if (this._sp) this._sp.destroy();
    return Cesium.destroyObject(this);
  }
}

const _lineFiles = new Map();
function fetchLines(url) {
  if (!_lineFiles.has(url)) {
    _lineFiles.set(url, fetch(url).then(r => {
      if (!r.ok) throw new Error(url + ": " + r.status);
      return r.arrayBuffer();
    }).then(buf => {
      const h = new Int32Array(buf, 0, 2);
      const n = h[0], tot = h[1];
      return { n, lens: new Uint16Array(buf, 8, n), pts: new Int16Array(buf, 8 + 2 * n, tot * 3) };
    }));
  }
  return _lineFiles.get(url);
}

const windPrims = new Map();
let windWanted = new Set();
// Whatever was asked for last decides what shows, so overlapping refreshes
// (a layer switch, then a jump in time) can never leave the lines hidden.
async function updateWindLines() {
  const run = viewer && WIND && isWind() && windAnim ? currentWindRun() : null;
  const urls = run ? [run.street].concat(windAir ? [run.air] : []) : [];
  windWanted = new Set(urls);
  for (const [u, p] of windPrims) p.show = windWanted.has(u);
  for (const u of urls) {
    if (windPrims.has(u)) continue;
    let lines;
    try { lines = await fetchLines(u); } catch (e) { console.error(e); continue; }
    if (windPrims.has(u)) continue;
    const p = new WindLines(lines, u.includes("/air_") ? "air" : "street", WIND.origin, WIND.spacing_k1_m);
    p.fraction = windDensity;
    windPrims.set(u, viewer.scene.primitives.add(p));
    p.show = windWanted.has(u);
  }
}

// The clock: light advances WIND_SPEEDUP x (wind / vertex spacing) vertices
// per second. A slow phone thins the lines instead of stuttering.
let _windLast = null, _fpsAcc = 0, _fpsN = 0, _fpsSince = 0;
function windTick() {
  const now = performance.now();
  const dt = _windLast === null ? 0 : Math.min(0.1, (now - _windLast) / 1000);
  _windLast = now;
  let any = false;
  if (WIND && isWind()) {
    const w = windNow();
    const rate = WIND_SPEEDUP * Math.max(0.5, w.speed) / WIND.spacing_k1_m;
    for (const p of windPrims.values()) {
      if (!p.show) continue;
      any = true;
      p.phase += dt * rate;
      p.speed = w.speed;
    }
  }
  if (!any || dt === 0 || document.hidden) { _fpsAcc = 0; _fpsN = 0; _fpsSince = now; return; }
  _fpsAcc += dt; _fpsN++;
  if (now - _fpsSince > 2500) {
    const fps = _fpsN / Math.max(1e-3, _fpsAcc);
    const settled = viewer.scene.globe.tilesLoaded && viewer.dataSourceDisplay.ready;
    if (settled && fps < 24 && windDensity > 0.3 && !windFull) {
      windDensity /= 2; windThinned = true;
      for (const p of windPrims.values()) p.fraction = windDensity;
      renderLegend();
    }
    _fpsAcc = 0; _fpsN = 0; _fpsSince = now;
  }
}

// The basemap is dimmed under the wind so the moving light reads.
let _baseSaved = null;
function windBasemap(on) {
  const base = viewer && viewer.imageryLayers.length ? viewer.imageryLayers.get(0) : null;
  if (!base) return;
  if (on && !_baseSaved) {
    _baseSaved = { b: base.brightness, s: base.saturation, c: base.contrast };
    base.brightness = 0.42; base.saturation = 0.25; base.contrast = 1.15;
  } else if (!on && _baseSaved) {
    base.brightness = _baseSaved.b; base.saturation = _baseSaved.s; base.contrast = _baseSaved.c;
    _baseSaved = null;
  }
}

function windSpeedLabel(k, v) { return (k * v).toFixed(1); }

function renderWindChangeLegend(c) {
  const w = windNow();
  const rows = WIND.change_legend.slice().reverse().map(e => {
    const lab = e.min >= 100 ? "more than doubled" : e.min >= 10 ? `${e.min} to ${e.max}% windier`
      : `${-e.max} to ${Math.min(100, -e.min)}% calmer`;
    return `<div class="row"><span class="sw" style="background:${e.color}"></span>${lab}</div>`;
  });
  $("legtitle").textContent = "Street wind, today vs 2017";
  $("legunits").textContent = `same wind from the ${compass16(c.dir)} (${c.dir}°), only the buildings differ; ` +
    `changes under 10% not drawn`;
  $("legrows").innerHTML = rows.join("") +
    `<div style="margin-top:8px;color:#79828f;font-size:9.5px;line-height:1.5">Park: ${fmt(c.park_ha_windier_30, 1)} ha
     at least 30% windier, ${fmt(c.park_ha_calmer_30, 1)} ha at least 30% calmer. Smoothed over 20 m.</div>`;
}

// Say so when the flow on screen was simulated for another direction.
function windDirNote(run, w) {
  if (!run) return "";
  const off = Math.abs(((run.dir - w.dir) % 360 + 540) % 360 - 180);
  if (off <= 0.5) return "";
  if (off <= 12) return `<div style="margin-top:6px;color:#79828f;font-size:9.5px">Nearest simulated direction: ${run.dir}°.</div>`;
  return `<div style="margin-top:6px;color:#ffb4a0;font-size:10px;line-height:1.45">The wind is from ${Math.round(w.dir)}°,
    but the nearest direction simulated so far is ${run.dir}°, ${Math.round(off)}° away: the pattern shown is only a rough guide.</div>`;
}

function renderWindLegend() {
  const cm = windMapChange ? currentWindChange() : null;
  if (cm) return renderWindChangeLegend(cm);
  const w = windNow(), run = currentWindRun();
  const V = Math.max(0.5, w.speed);
  const rows = WIND.legend.slice().reverse().map(e => {
    const lab = e.max >= 3.9 ? `over ${windSpeedLabel(e.min, V)} m/s`
      : `${windSpeedLabel(e.min, V)} to ${windSpeedLabel(e.max, V)} m/s`;
    const note = e.min <= 1 && e.max > 1 ? "open lawn" : (e.max <= 0.4 ? "sheltered" : (e.min >= 1.5 ? "gusty corner" : ""));
    return `<div class="row"><span class="sw" style="background:${e.color}"></span>${lab}` +
      (note ? ` <span style="color:#79828f;font-size:9.5px">&nbsp;${note}</span>` : "") + `</div>`;
  });
  $("legtitle").textContent = "Wind at street level";
  $("legunits").textContent = (w.live ? "live, " : "") +
    `from the ${compass16(w.dir)} (${Math.round(w.dir)}°), ${fmt(V, 1)} m/s on the open lawn` +
    (w.live ? "" : `, ${hseason().label.toLowerCase()} ${hstep().time} EST`);
  const lines = windAnim ? `<div style="margin-top:8px;color:#79828f;font-size:9.5px;line-height:1.5">
    Lines follow the simulated wind 2.5 m up and through the air around the towers. The light
    moves at the wind's speed, ${WIND_SPEEDUP} times faster than real.
    ${windThinned ? " Fewer lines on this device to keep it smooth." : ""}</div>` : "";
  const grown = HEAT.towers && HEAT.towers.length
    ? `<div class="row" style="margin-top:6px"><span class="sw" style="background:${GROWN_CSS}"></span>
       grew since 2017</div>` : "";
  $("legrows").innerHTML = rows.join("") + grown + lines +
    windDirNote(run, w);
}

function renderWindStats() {
  const w = windNow(), run = currentWindRun();
  const V = Math.max(0.5, w.speed);
  const rows = [
    [w.live ? "Live wind (10 m)" : "Station wind", `${compass16(w.dir)} ${fmt(w.speed, 1)} m/s`],
    ["Typical spot in the park", run ? `${fmt(run.park_k_median * V, 1)} m/s` : "--"],
    ["Windiest tenth of the park", run ? `over ${fmt(run.park_k_p90 * V, 1)} m/s` : "--"]
  ];
  if (w.live && windLive) rows.push(["Gusts", `${fmt(windLive.gust, 1)} m/s`],
                                    ["Air temperature", `${fmt(windLive.ta, 1)} &deg;C`]);
  else {
    const ws = windHeatStep();
    if (ws) rows.push(["Park feels like, with this wind", `${fmt(isTodayBuild()
      ? ws.park_felt_today_c : ws.park_felt_2017_c, 1)} &deg;C`]);
  }
  $("statshead").textContent = w.live ? "Live now" : hseason().label;
  $("statstable").innerHTML = rows
    .map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("");
  $("statscope").innerHTML = (windLiveErr && windLiveMode ? `<b>${windLiveErr}.</b> ` : "") +
    (w.live ? `Open-Meteo (NOAA HRRR model), ${windLive ? windLive.time.replace("T", " ") : ""} New York time. ` : "") +
    `Central Park within 1.5 km of 59th Street. Time-mean wind from a 3D simulation on 8 m cells,
     as a ratio to the park's open lawns, which get the ${w.live ? "live" : "weather station's"} wind.`;
}

  if (activeLayer === "sunhours") return day().sunhours.png;
  return DATA.svf ? DATA.svf.png : day().sunhours.png;
}

// Image loads are asynchronous, so a quick layer switch can finish out of
// order. Only the newest request may replace the overlay.
let _overlaySeq = 0;
async function drawOverlay() {
  const my = ++_overlaySeq;
  const b = isHeat() ? HEAT.bounds : DATA.site.bounds;
  const rect = Cesium.Rectangle.fromDegrees(b.west, b.south, b.east, b.north);
  const url = currentImage();
  let provider;
  if (Cesium.SingleTileImageryProvider.fromUrl) {
    provider = await Cesium.SingleTileImageryProvider.fromUrl(url, { rectangle: rect });
  } else {
    provider = new Cesium.SingleTileImageryProvider({ url, rectangle: rect });
  }
  if (my !== _overlaySeq) return;
  const next = viewer.imageryLayers.addImageryProvider(provider);
  next.alpha = overlayAlpha();
  next.magnificationFilter = Cesium.TextureMagnificationFilter.NEAREST;
  if (overlayLayer) viewer.imageryLayers.remove(overlayLayer, true);
  overlayLayer = next;
}

/* ------------------------------------------------------------------ *
 * Buildings
 * ------------------------------------------------------------------ */
function closeRing(ring) {
  const a = ring[0], z = ring[ring.length - 1];
  const closed = a[0] === z[0] && a[1] === z[1];
  return closed ? ring : ring.concat([a]);
}

function buildingGeoJson() {
  return {
    type: "FeatureCollection",
    features: DATA.buildings.map((b, i) => ({
      type: "Feature", id: i,
      properties: { height: b.height, idx: i },
      // GeoJSON wants a closed ring, but the pipeline already closes them.
      // Closing a second time leaves two identical points in a row and
      // Cesium's tessellator throws on that, which kills the whole page.
      geometry: { type: "Polygon", coordinates: [closeRing(b.ring)] }
    }))
  };
}

// Context buildings sit outside the study frame. One light, flat colour, so
// the eye reads them as the rest of the city and not as part of the result.
const CONTEXT_CSS = "#7d8590";

const GROWN_CSS = "#f5c451";   // heat views: the buildings that grew since 2017

function buildingColour(b) {
  if (HEAT && isHeat() && towerFor(b)) {
    return Cesium.Color.fromCssColorString(GROWN_CSS).withAlpha(buildOpacity);
  }
  if (b.context) {
    return Cesium.Color.fromCssColorString(CONTEXT_CSS).withAlpha(buildOpacity);
  }
  if (buildMode === "flat" || !hasFacades()) {
    const t = Math.max(0, Math.min(1, (b.height - 15) / 240));
    return Cesium.Color.fromCssColorString("#333b47")
      .brighten(t * 0.42, new Cesium.Color()).withAlpha(buildOpacity);
  }
  const v = buildingValue(b);
  if (v === null) {
    return Cesium.Color.fromCssColorString("#333b47").withAlpha(buildOpacity);
  }
  const t = Math.max(0, Math.min(0.999, v / buildingMax()));
  return Cesium.Color.fromCssColorString(rampColour(t)).withAlpha(buildOpacity);
}

function recolourBuildings() {
  if (!buildingSource) return;
  const ents = buildingSource.entities.values;
  for (let i = 0; i < ents.length; i++) {
    const e = ents[i];
    const b = DATA.buildings[e.properties.idx.getValue()];
    // Context never changes colour with the day or the mode, only with the
    // opacity slider. Skipping it saves rebuilding thousands of polygons.
    if (b.context && e._alpha === buildOpacity) continue;
    if (b.context) e._alpha = buildOpacity;
    e.polygon.material = buildingColour(b);
  }
  refreshSplit();
}

async function addBuildings() {
  if (!DATA.buildings || !DATA.buildings.length) return;
  // One bad polygon should cost you that polygon, not the whole scene.
  let src;
  try {
    src = await Cesium.GeoJsonDataSource.load(buildingGeoJson(), { clampToGround: false });
  } catch (e) {
    console.error("buildings failed to load:", e);
    $("boot").innerHTML = `<div class="inner">
      <div style="color:#ffb4a0;margin-bottom:8px">Buildings failed to load</div>
      <div style="color:#8b94a0;font-size:11.5px">${describe(e)}</div>
      <div style="color:#5c646f;font-size:11px;margin-top:10px">
        The rest of the scene still works. Reload with buildings off if needed.</div>
    </div>`;
    return;
  }
  src.entities.values.forEach(e => {
    const b = DATA.buildings[e.properties.idx.getValue()];
    e.polygon.extrudedHeight = b.height;
    e.polygon.height = 0;
    e.polygon.material = buildingColour(b);
    e.polygon.outline = true;
    e.polygon.outlineColor = Cesium.Color.fromCssColorString("#0f1319").withAlpha(0.55);
  });
  await viewer.dataSources.add(src);
  buildingSource = src;
}

/* ------------------------------------------------------------------ *
 * Legend and stats
 * ------------------------------------------------------------------ */
function renderBuildingLegend() {
  if (!hasFacades() || buildMode === "flat") return "";
  const max = buildingMax();
  const unit = buildMode === "gain" ? " kWh/m2" : " h";
  const rows = [];
  for (let i = WALL_RAMP.length - 1; i >= 0; i--) {
    const lo = (max * i / WALL_RAMP.length);
    const hi = (max * (i + 1) / WALL_RAMP.length);
    rows.push(`<div class="row"><span class="sw" style="background:${WALL_RAMP[i]}">`
      + `</span>${lo.toFixed(1)} to ${hi.toFixed(1)}${unit}</div>`);
  }
  const title = buildMode === "gain"
    ? "Sunniest wall, solar gain" : "Sunniest wall, sun hours";
  const sub = buildMode === "gain"
    ? "clear sky, per m2, " + day().label + " \u00b7 top bin is 95th pct and above"
    : "on the building's best-facing wall, " + day().label;
  return `<div style="margin-top:9px;border-top:1px solid rgba(255,255,255,.1);
    padding-top:7px"><div class="lt">${title}</div>
    <div class="lu">${sub}</div>${rows.join("")}</div>`;
}

function renderLegend() {
  if (isHeat()) return renderHeatLegend();
  if (activeLayer === "shade") {
    $("legtitle").textContent = "Direct sun";
    $("legunits").textContent = `${day().label} at ${day().hours[hourIndex].hour}`;
    $("legrows").innerHTML = [["#f5c451", "in direct sun"], ["#1b3a6b", "in shadow"]]
      .map(([c, l]) => `<div class="row"><span class="sw" style="background:${c}"></span>${l}</div>`)
      .join("") + renderBuildingLegend();
    return;
  }
  const L = activeLayer === "sunhours" ? day().sunhours : DATA.svf;
  if (!L) return;
  $("legtitle").textContent = L.title;
  $("legunits").textContent = L.units;
  $("legrows").innerHTML = L.legend.slice().reverse().map(e => {
    const lab = activeLayer === "svf"
      ? `${fmt(e.min, 2)} to ${fmt(e.max, 2)}`
      : `${fmt(e.min, 1)} to ${fmt(e.max, 1)} h`;
    return `<div class="row"><span class="sw" style="background:${e.color}"></span>${lab}</div>`;
  }).join("") + renderBuildingLegend();
}

function renderStats() {
  if (isHeat()) return renderHeatStats();
  const d = day(), s = d.stats;
  let rows = [], note = "";
  if (activeLayer === "shade") {
    const h = d.hours[hourIndex];
    rows = [
      ["Street in sun now", pct(h.sunlit_fraction)],
      ["Street in shadow now", pct(1 - h.sunlit_fraction)],
      ["Sun height", fmt(h.altitude, 1) + "&deg;"],
      ["Sun direction", fmt(h.azimuth, 0) + "&deg; from N"]
    ];
    note = "Share of open street that can see the sun at this exact moment.";
  } else if (activeLayer === "sunhours") {
    rows = [
      ["Typical street sun", fmt(s.median_sun_hours, 1) + " h"],
      ["Street with no sun at all", pct(s.frac_street_no_sun)],
      ["Street under 2 hours", pct(s.frac_street_under_2h)],
      ["Street over half the day", pct(s.frac_street_over_half_day)]
    ];
    note = "Inside the CEQR window of " + fmt(d.daylight_hours_modelled, 1) +
           " h on " + d.label + ", EST. Medians across every open cell.";
  } else if (DATA.svf) {
    const v = DATA.svf.stats;
    rows = [
      ["Typical sky visible", fmt(v.median, 2)],
      ["Most enclosed spot", fmt(v.min, 2)],
      ["Most open spot", fmt(v.max, 2)],
      ["Open field would be", "1.00"]
    ];
    note = "Fraction of the sky hemisphere visible from street level. " +
           "Lower means a deeper canyon.";
  }
  if (s.resource && activeLayer !== "svf") {
    const r = s.resource;
    const park = activeLayer === "shade"
      ? [[`${r.name} in sun now`, pct(d.hours[hourIndex].resource_sunlit || 0)]]
      : [[`${r.name}, typical sun`, fmt(r.median_sun_hours, 1) + " h"],
         [`${r.name} never in sun`, pct(r.frac_no_sun)],
         [`${r.name} under 2 h`, pct(r.frac_under_2h)]];
    rows = park.concat(rows);
  }
  $("statshead").textContent = activeLayer === "svf" ? "Sky view" : d.label;
  $("statstable").innerHTML = rows
    .map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("");
  $("statscope").innerHTML = note + (DATA.site.edge_margin_m > 0
    ? ` Rooftops and a ${DATA.site.edge_margin_m} m border are excluded throughout.`
    : " Rooftops are excluded throughout." + (s.resource
      ? ` Street means open ground outside buildings and outside ${s.resource.name}.` : ""));
}

function renderRecBadge() {
  const d = day();
  if (isWind()) {
    const w = windNow();
    $("recbadge").innerHTML = `<b>Central Park</b> &nbsp; wind from the ${compass16(w.dir)}, ` +
      `${fmt(w.speed, 1)} m/s &nbsp; <span>${w.live ? "live" : hstep().time + " EST"}</span>`;
    return;
  }
  if (isHeat()) {
    const what = activeLayer === "change" ? "colder than in 2017"
      : `feels like, ${isTodayBuild() ? "today" : "2017"}`;
    $("recbadge").innerHTML = `<b>Central Park</b> &nbsp; ${what}, ` +
      `${hseason().label.toLowerCase()} &nbsp; <span>${hstep().time} EST</span>`;
    return;
  }
  if (activeLayer === "shade") {
    $("recbadge").innerHTML =
      `<b>${DATA.site.name}</b> &nbsp; ${d.label} &nbsp; <span>${d.hours[hourIndex].hour}</span>`;
  } else if (activeLayer === "sunhours") {
    $("recbadge").innerHTML =
      `<b>${DATA.site.name}</b> &nbsp; hours of direct sun, ${d.label}`;
  } else {
    $("recbadge").innerHTML = `<b>${DATA.site.name}</b> &nbsp; sky view factor`;
  }
}

/* ------------------------------------------------------------------ *
 * Interaction
 * ------------------------------------------------------------------ */
// On a portrait phone the legend sits directly on top of the stats sheet. Its
// height changes with the layer, so it is measured rather than guessed; a fixed
// offset left a big empty gap between the two.
function placeInfo() {
  const lg = $("legend");
  const stacked = document.body.classList.contains("m-info") &&
                  window.innerWidth < 560;
  if (!stacked) {
    lg.style.removeProperty("bottom"); lg.style.removeProperty("max-height");
    return;
  }
  const h = $("stats").offsetHeight;
  const bottom = 104 + h + 8;
  lg.style.setProperty("bottom", bottom + "px", "important");
  lg.style.setProperty("max-height",
    Math.max(90, window.innerHeight - bottom - 64) + "px", "important");
}

function refresh() {
  drawOverlay(); renderLegend(); renderStats(); renderRecBadge(); updateCompass(true);
  updateColumns(); updateWindLines(); windBasemap(isWind());
  if (HEAT) $("tcols").style.display = isFelt() ? "" : "none";
  if (WINDHEAT) $("tlocal").style.display = isFelt() ? "" : "none";
  if (WIND) {
    for (const id of ["twind", "tair"]) $(id).style.display = isWind() ? "" : "none";
    $("twmap").style.display = isWind() && WIND.changes && WIND.changes.length ? "" : "none";
  }
  if (overlayLayer) overlayLayer.alpha = overlayAlpha();
  $("hdrcav").textContent = isWind() ? WIND_CAVEAT
    : isHeat() ? (WIND && feltIsLocal() ? HEAT_CAVEAT_LOCAL : HEAT_CAVEAT) : SHADE_CAVEAT;
  requestAnimationFrame(placeInfo); refreshSplit();
}

function setLayer(name) {
  if (name === "svf" && !hasSvf()) return;
  if ((name === "felt" || name === "change") && !HEAT) return;
  if (name === "wind" && !WIND) return;
  const wasHeat = isHeat(), wasWind = isWind();
  activeLayer = name;
  document.querySelectorAll("#layerseg button").forEach(b =>
    b.classList.toggle("on", b.dataset.layer === name));
  const timeActive = name === "shade" || isHeat();
  $("timesl").classList.toggle("off", !timeActive);
  $("play").style.opacity = timeActive ? "1" : ".35";
  $("play").style.pointerEvents = timeActive ? "auto" : "none";
  if (!timeActive) stopPlay();
  if (wasWind !== isWind()) {
    if (!isWind() && windLiveMode) setLive(false);
    if (isWind()) $("timesl").classList.toggle("off", windLiveMode);
  }
  if (wasHeat !== isHeat() || wasWind !== isWind()) {
    // The heat layers run on their own days and hours.
    stopPlay();
    renderDaySeg();
    if (wasHeat !== isHeat()) heatBuildings(isHeat());
    $("time").max = nSteps() - 1;
    if (isHeat()) prefetchHeat();
    setHour(isHeat() ? Math.min(heatStep, nSteps() - 1) : hourIndex);
    return;
  }
  refresh();
}

// Big builds keep each image in its own file next to the page. Ask for the
// whole day's frames up front so pressing play does not stall on the network.
const _warm = new Set();
function prefetchDay(d) {
  const urls = d.hours.map(h => h.png).concat([d.sunhours.png]);
  for (const u of urls) {
    if (!u || u.startsWith("data:") || _warm.has(u)) continue;
    _warm.add(u);
    const im = new Image();
    im.src = u;
  }
}

function setDay(i) {
  if (isWind() && i >= HEAT.seasons.length) {
    document.querySelectorAll("#dayseg button").forEach((b, j) => b.classList.toggle("on", j === i));
    setLive(true);
    return;
  }
  if (isWind() && windLiveMode) { windLiveMode = false; setLive(false); }
  if (isHeat()) {
    const first = heatSeason !== i;
    heatSeason = i;
    document.querySelectorAll("#dayseg button").forEach((b, j) =>
      b.classList.toggle("on", j === i));
    $("time").max = nSteps() - 1;
    prefetchHeat();
    setHour(first ? worstStep(hseason()) : Math.min(heatStep, nSteps() - 1));
    return;
  }
  dayIndex = i;
  document.querySelectorAll("#dayseg button").forEach((b, j) =>
    b.classList.toggle("on", j === i));
  const n = day().hours.length;
  $("time").max = n - 1;
  setHour(Math.min(hourIndex, n - 1));
  prefetchDay(day());
  for (const k in _domCache) delete _domCache[k];
  recolourBuildings();
}

function setHour(i) {
  if (isHeat()) {
    heatStep = i;
    const s = hstep();
    $("timeval").textContent = s.time;
    $("sunalt").textContent = "sun " + fmt(s.sun.alt, 1) + "° up";
    $("sunaz").textContent = fmt(s.sun.az, 0) + "° from N";
    $("time").value = i;
    refresh();
    return;
  }
  hourIndex = i;
  const h = day().hours[i];
  $("timeval").textContent = h.hour;
  $("sunalt").textContent = "sun " + fmt(h.altitude, 1) + "\u00b0 up";
  $("sunaz").textContent = fmt(h.azimuth, 0) + "\u00b0 from N";
  $("time").value = i;
  refresh();
}

function stopPlay() {
  playing = false;
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  $("play").classList.remove("on");
  $("play").textContent = "Play the day";
}

function togglePlay() {
  if (playing) return stopPlay();
  if (isWind() && windLiveMode) return;
  playing = true;
  $("play").classList.add("on");
  $("play").textContent = "Stop";
  playTimer = setInterval(() =>
    setHour(((isHeat() ? heatStep : hourIndex) + 1) % nSteps()), isHeat() ? 1100 : 750);
}

function toggleRec() {
  recMode = !recMode;
  document.body.classList.toggle("rec", recMode);
  $("trec").classList.toggle("on", recMode);
  $("trec").textContent = recMode ? "Show the controls" : "Clean view for recording";
}

function homeView() {
  // Manhattan's street grid runs about 29 degrees east of true north, so the
  // camera looks straight up the avenues from behind the site. Heading and the
  // offset direction must agree: the camera sits opposite the way it looks.
  // A whole-park run says where to start, the south end with the towers in
  // front; older runs fall back to looking up from behind the frame centre.
  const s = DATA.site, cam = s.camera;
  const heading = cam ? cam.heading : 29;
  const back = cam ? cam.back_m : s.span_m * 0.95;   // metres behind the target
  const tLat = cam ? cam.lat : s.centre_lat, tLon = cam ? cam.lon : s.centre_lon;
  const h = Cesium.Math.toRadians(heading);
  const dN = -back * Math.cos(h), dE = -back * Math.sin(h);
  const lat = tLat + dN / 111320;
  const lon = tLon + dE / (111320 * Math.cos(Cesium.Math.toRadians(tLat)));
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, cam ? cam.height_m : s.span_m * 0.62),
    orientation: { heading: h, pitch: Cesium.Math.toRadians(cam ? cam.pitch : -33), roll: 0 },
    duration: 1.5
  });
}

function wireUp() {

  $("tcols").addEventListener("click", () => {
    showCols = !showCols;
    $("tcols").classList.toggle("on", showCols);
    $("tcols").textContent = showCols ? "3D columns on" : "3D columns off";

    windAnim = !windAnim;

  });
  $("tair").addEventListener("click", () => {
    windAir = !windAir;
    setToggle("tair", windAir, "3D air lines on", "3D air lines off");

  });
  $("twmap").addEventListener("click", () => {
    windMapChange = !windMapChange;

  });

  $("time").addEventListener("input", e => { stopPlay(); setHour(+e.target.value); });

  $("op").addEventListener("input", e => {

  document.querySelectorAll("#layerseg button").forEach(b => {

    b.addEventListener("click", () => setLayer(b.dataset.layer));
  });
  $("tbuild").addEventListener("click", () => {
    if (!buildingSource) return;
    const on = buildingSource.show = !buildingSource.show;

  });

    .map(([k, l]) => `<button data-bm="${k}"${k === buildMode ? ' class="on"' : ""}>${l}</button>`)
    .join("");
  document.querySelectorAll("#bmode button").forEach(bn =>
    bn.addEventListener("click", () => {

      recolourBuildings(); renderLegend();
    }));
  $("bop").addEventListener("input", e => {
    buildOpacity = +e.target.value / 100;
    $("bopval").textContent = e.target.value + "%";

  });
  $("thome").addEventListener("click", homeView);
  const sheet = which => {

    if (on) document.body.classList.add(which);
    $("mbctrl").classList.toggle("on", document.body.classList.contains("m-ctrl"));
    $("mbinfo").classList.toggle("on", document.body.classList.contains("m-info"));
    requestAnimationFrame(placeInfo);
  };
  $("mbctrl").addEventListener("click", () => sheet("m-ctrl"));
  window.addEventListener("resize", placeInfo);
  $("mbinfo").addEventListener("click", () => sheet("m-info"));
  $("mbabout").addEventListener("click", () => {
    document.body.classList.remove("m-ctrl", "m-info");
    $("about").style.display = "block";
  });
  $("tsplit").addEventListener("click", () => {
    if (!hasBothModes()) {
      if (cmpState === "loading") {
        $("tsplit").textContent = "Loading the comparison...";
        setTimeout(() => { if (!splitMode) $("tsplit").textContent = "Compare 2017 vs today"; }, 1800);
        return;
      }
      $("tsplit").textContent = "No comparison file";
      $("tsplit").disabled = true;
      return;

  });
  $("trec").addEventListener("click", toggleRec);
  $("closeabout").addEventListener("click", () => $("about").style.display = "none");
  $("closepick").addEventListener("click", () => $("pick").style.display = "none");

  document.addEventListener("keydown", e => {
    if (e.key === "r" || e.key === "R") toggleRec();
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
    if (e.key === "Escape") { $("about").style.display = "none"; $("pick").style.display = "none"; }
    const cur = isHeat() ? heatStep : hourIndex;
    if (e.key === "ArrowRight") { stopPlay(); setHour(Math.min(cur + 1, nSteps() - 1)); }
    if (e.key === "ArrowLeft") { stopPlay(); setHour(Math.max(cur - 1, 0)); }
  });

  viewer.screenSpaceEventHandler.setInputAction(click => {
    const picked = viewer.scene.pick(click.position);
    if (Cesium.defined(picked) && picked.id && picked.id.heatFelt) {
      const u = picked.id.u;
      const cat = HEAT.legend.categories.find(c => u >= c.min && u < c.max);
      $("picktable").innerHTML = [
        ["This 10 m square feels like", `${fmt(u, 1)} &deg;C`],
        ["Stress category", cat ? cat.label : "--"],
        ["Air temperature", `${fmt(hstep().air_c, 1)} &deg;C`],
        ["At", `${hstep().time} EST, ${isTodayBuild() ? "today" : "2017"}`]
      ].map(([k, x]) => `<tr><td>${k}</td><td class="v">${x}</td></tr>`).join("");
      $("picknote").innerHTML = "Feels-like temperature (UTCI) at body height, averaged over the "
        + "ground in this square. Column height shows how far it is from comfortable. Model estimate.";
      $("pick").style.display = "block";
      return;
    }
    if (Cesium.defined(picked) && picked.id && picked.id.heatColumn) {
      const v = picked.id.v;
      $("picktable").innerHTML = [
        ["This 10 m square of the park", v < 0 ? `${fmt(-v, 1)} &deg;C colder` : `${fmt(v, 1)} &deg;C warmer`],
        ["than in 2017, at", `${hstep().time} EST`],
        ["On", hseason().label.toLowerCase()]
      ].map(([k, x]) => `<tr><td>${k}</td><td class="v">${x}</td></tr>`).join("");
      $("picknote").innerHTML = "Feels-like temperature (UTCI) averaged over the ground in this square. "
        + "Same weather in both years; only the buildings differ. Model estimate.";
      $("pick").style.display = "block";
      return;
    }
    if (!Cesium.defined(picked) || !picked.id || !picked.id.properties) {
      $("pick").style.display = "none";
      return;
    }
    const b = DATA.buildings[picked.id.properties.idx.getValue()];
    const rows = [
      [`Height above street`,
       `${fmt(b.height, 0)} m / ${fmt(b.height * 3.28084, 0)} ft`],
    ];
    const tw = towerFor(b);
    if (tw) {
      rows.push([`Grown since 2017`, `${fmt(tw.lidar_p99_m, 0)} m &rarr; ${fmt(tw.height_m, 0)} m`]);
      rows.push([`Park it makes 5 &deg;C+ colder`,
        `${fmt(tw.dec_ha_any_hour_5, 1)} ha <span style="color:#79828f">Dec</span>`]);
      rows.push([`Park-hours 5 &deg;C+ colder`,
        `${fmt(tw.dec_ha_hours_5, 1)} ha-h <span style="color:#79828f">Dec</span>`]);
    }
    if (b.sun && b.sun[day().id]) {
      const s = b.sun[day().id];
      const maxh = day().facade_hours_max || day().hours.length;
      const other = DATA.days.find(d => d.id !== day().id);
      const os = other && b.sun[other.id];
      rows.push([`&nbsp;`, `<span style="color:#79828f;font-weight:400">` +
                 `${day().short} &nbsp; ${other ? other.short : ""}</span>`]);
      for (const o of ["N", "E", "S", "W"]) {
        if (!s[o]) continue;
        const a = s[o][0], bb = os ? os[o][0] : null;
        rows.push([`${o} facing wall`,
          `${fmt(a, 1)} h &nbsp; <span style="color:#79828f">` +
          `${bb === null ? "" : fmt(bb, 1) + " h"}</span>`]);
      }
      rows.push([`Sunniest wall`, `${fmt(s.h, 1)} of ${fmt(maxh, 0)} h`]);
      rows.push([`Base of that wall`, `${fmt(s.lo, 1)} h`]);
      rows.push([`Crown of that wall`, `${fmt(s.hi, 1)} h`]);
      rows.push([`Solar gain on it`, `${fmt(s.kwh, 2)} kWh/m&sup2;`]);
    }
    $("picktable").innerHTML = rows
      .map(([k, v]) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`).join("");
    $("picknote").innerHTML = (tw ? "Park figures: the part of Central Park's south end "
        + "(within 1.5 km of 59th St) that feels at least 5 &deg;C colder because this tower's "
        + "new height shades it, on the clear December day. Model estimate. " : "")
      + (b.context
      ? "Outside the study frame. It is drawn because its shadow reaches in; "
        + "its walls are not scored."
      : b.sun
      ? "Each wall is tested for which way it faces and what stands in front "
        + "of it, hour by hour. Base and crown are the lower and upper half of "
        + "the sunniest wall. Solar gain is the direct beam under a clear sky, "
        + "an upper bound with no cloud."
      : "Facade solving was skipped for this run.");
    $("pick").style.display = "block";
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}


/* ------------------------------------------------------------------ *
 * Compass and sun.
 *
 * The rose turns with the camera, so the arrow in the middle is always
 * "the way you are looking" and the red N is always true north. The sun
 * marker sits on the rose at its real azimuth for the current frame, and a
 * ray in the scene points at it, so you can see where the light is coming
 * from without doing any geometry in your head.
 * ------------------------------------------------------------------ */
let _lastHeading = null, sunRay = null, sunDot = null;

function currentSun() {
  if (isHeat()) {
    const s = hstep();
    return { alt: s.sun.alt, az: s.sun.az, label: s.time };
  }
  const h = day().hours[hourIndex];
  return { alt: h.altitude, az: h.azimuth, label: h.hour };
}

function updateCompass(force) {
  if (!viewer) return;
  const heading = Cesium.Math.toDegrees(viewer.camera.heading);
  if (!force && _lastHeading !== null && Math.abs(heading - _lastHeading) < 0.3) return;
  _lastHeading = heading;
  $("crose").setAttribute("transform", `rotate(${-heading})`);
  const sun = currentSun();
  const rel = Cesium.Math.toRadians(sun.az - heading);
  // Higher sun sits closer to the centre, like a sky chart.
  const r = 40 * Math.max(0.15, 1 - sun.alt / 90);
  $("csun").setAttribute("transform", `translate(${r * Math.sin(rel)},${-r * Math.cos(rel)})`);
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  const look = dirs[Math.round(((heading % 360) + 360) % 360 / 45) % 8];
  $("ctxt").innerHTML = `looking ${look}<br><b>sun ${fmt(sun.alt, 0)}&deg; up</b>, ` +
    `${fmt(sun.az, 0)}&deg;`;
}

function sunAnchor() {
  const s = DATA.site, cam = s.camera;
  return cam ? { lat: cam.lat, lon: cam.lon, len: cam.back_m * 0.8 }
             : { lat: s.centre_lat, lon: s.centre_lon, len: s.span_m * 0.75 };
}

function sunEnd() {
  const a = sunAnchor(), sun = currentSun();
  const s = { centre_lat: a.lat, centre_lon: a.lon };
  const L = a.len;
  const alt = Cesium.Math.toRadians(sun.alt), az = Cesium.Math.toRadians(sun.az);
  const east = L * Math.cos(alt) * Math.sin(az);
  const north = L * Math.cos(alt) * Math.cos(az);
  const up = L * Math.sin(alt);
  const lat = s.centre_lat + north / 111320;
  const lon = s.centre_lon + east / (111320 * Math.cos(Cesium.Math.toRadians(s.centre_lat)));
  return Cesium.Cartesian3.fromDegrees(lon, lat, up);
}

function addSun() {
  const a = sunAnchor();
  const base = Cesium.Cartesian3.fromDegrees(a.lon, a.lat, 0);
  sunRay = viewer.entities.add({
    polyline: {
      positions: new Cesium.CallbackProperty(() => [base, sunEnd()], false),
      width: 6,
      material: new Cesium.PolylineGlowMaterialProperty({
        glowPower: 0.25, color: Cesium.Color.fromCssColorString("#f5c451").withAlpha(0.85)
      })
    }
  });
  sunDot = viewer.entities.add({
    position: new Cesium.CallbackProperty(() => sunEnd(), false),
    point: { pixelSize: 22, color: Cesium.Color.fromCssColorString("#ffd76a"),
             outlineColor: Cesium.Color.fromCssColorString("#ff9d3a"), outlineWidth: 3,
             disableDepthTestDistance: Number.POSITIVE_INFINITY }
  });
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
async function start() {

  let src;
  try { src = await loadCesium(); } catch (e) { return bootFail(); }
  try { DATA = await _dataFetch; } catch (e) { return bootFail("Could not load the model data", e); }
  // Only OpenStreetMap tiles and our own overlays are used, never Cesium Ion.
  // This must run after the library has loaded, not before.
  Cesium.Ion.defaultAccessToken = "";

  viewer = new Cesium.Viewer("cesiumContainer", {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(
      Promise.resolve(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/"
      }))),
    animation: false, timeline: false, geocoder: false, homeButton: false,
    sceneModePicker: false, baseLayerPicker: false, navigationHelpButton: false,
    fullscreenButton: false, infoBox: false, selectionIndicator: false,
    orderIndependentTranslucency: false
  });
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#1d2129");
  viewer.scene.preRender.addEventListener(windTick);
  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.scene.fog.enabled = true;
  $("tsplit").style.opacity = ".4";
  $("tsplit").title = "Loading the other build";

  // A link straight into a heat layer (?layer=felt or ?layer=change) builds the
  // buildings in their heat colours from the start, so nothing is rebuilt.
  const q0 = new URLSearchParams(location.search);
  const L0 = q0.get("layer");
  if (q0.get("anim") === "0") windAnim = false;
  if (q0.get("anim") === "1") windAnim = true;
  if (q0.get("localwind") === "0") localWind = false;
  if (L0 === "felt" || L0 === "change" || L0 === "wind") {
    const h = await _heatFetch;
    if (h) {
      HEAT = h;
      const si = HEAT.seasons.findIndex(s => s.id === q0.get("season"));
      heatSeason = si >= 0 ? si : 0;
      heatStep = worstStep(HEAT.seasons[heatSeason]);
      activeLayer = L0 === "wind" ? "felt" : L0;
      if (hasFacades()) { savedBuildMode = buildMode; buildMode = "flat"; }
      document.querySelectorAll("#layerseg button").forEach(b =>
        b.classList.toggle("on", b.dataset.layer === activeLayer));
    }
  }
  renderCopy();
  await addBuildings();
  wireUp();
  addSun();
  viewer.scene.postRender.addEventListener(() => updateCompass(false));
  hourIndex = Math.floor(DATA.days[0].hours.length / 2);
  if (isHeat()) { $("time").max = nSteps() - 1; setDay(heatSeason); } else setDay(0);
  homeView();
  $("boot").style.display = "none";
  // Heat layers are optional and live in their own file next to the page.
  // URL options make the views scriptable for screenshots:
  //   ?layer=felt|change  &season=dec|jun  &t=14:30  &rec=1  &cols=0
  loadHeat().then(async ok => {
    if (!ok) return;
    await loadWind();
    const q = new URLSearchParams(location.search);
    if (!isHeat()) {
      heatStep = worstStep(HEAT.seasons[0]);
      const si = HEAT.seasons.findIndex(s => s.id === q.get("season"));
      if (si >= 0) { heatSeason = si; heatStep = worstStep(HEAT.seasons[si]); }
    }
    if (q.get("cols") === "0") { showCols = false; $("tcols").classList.remove("on");
                                 $("tcols").textContent = "3D columns off"; }
    const L = q.get("layer");
    if (L === "felt" || L === "change" || (L === "wind" && WIND)) {
      if (L === "wind" && activeLayer === "wind") { activeLayer = "felt"; }
      setLayer(L);
      const ti = hseason().steps.findIndex(s => s.time === q.get("t"));
      if (ti >= 0) setHour(ti);
      if (L === "wind" && q.get("season") === "live") setDay(HEAT.seasons.length);
    }
    if (q.get("rec") === "1" && !recMode) toggleRec();
  });
  // The other build is as big as this one. Fetch it once the scene is up,
  // so the first picture never waits on two downloads.
  loadComparison().then(() => {
    cmpState = DATA2 ? "ready" : "none";
    $("tsplit").style.opacity = DATA2 ? "" : ".4";
    $("tsplit").title = DATA2 ? ""
      : "Open the today or 2017 build via serve.py to enable comparison";
  });
  console.log("map library loaded from: " + src.name);
}

// Load the comparison dataset if it exists.
// The "today" build is always index.html; the 2017 build is 2017.html.
// When viewing the today build, try to load 2017 data.
// When viewing the 2017 build, try to load today data.
// Fail silently either way.
async function loadComparison() {
  const isTodayBuild = DATA.model && DATA.model.scenario &&
                       DATA.model.scenario.type === "today";
  // Deployed names first, then the local build names, so it works both on
  // Cloudflare and under serve.py. Over file:// every fetch is refused, which
  // is why comparison needs a server.
  const urls = isTodayBuild ? ["2017.html", "shadow-twin-2017.html"]
                            : ["index.html", "shadow-twin-today.html"];
  try {
    let text = null;
    for (const u of urls) {
      try {
        const r = await fetch(u);
        if (r.ok) { text = await r.text(); if (/(?:const|let) DATA = /.test(text)) break; }
      } catch (_) {}
      text = null;
    }
    if (!text) return;
    // The data sits on one line. Read to the end of that line and trim, which
    // works whether the file was built with Unix or Windows line endings.
    // Looking for ";\n" failed on every Windows build, because there the
    // line ends in ";\r\n".
    const m = /(?:const|let) DATA = /.exec(text);
    if (!m) return;
    const rest = text.slice(m.index + m[0].length);
    const nl = rest.indexOf("\n");
    let js = (nl < 0 ? rest : rest.slice(0, nl)).trim();
    if (js.endsWith(";")) js = js.slice(0, -1);
    try { DATA2 = JSON.parse(js); } catch (_) { return; }
    // A big build names its data file instead; fetch that.
    if (typeof DATA2 === "string") {
      const r = await fetch(DATA2);
      DATA2 = r.ok ? await r.json() : null;
    }
  } catch (_) { /* comparison file not present, that is fine */ }
}

async function startSplit() {
  if (!DATA2) return;
  splitMode = true;
  $("tsplit").classList.add("on");
  $("tsplit").textContent = "Exit comparison";
  $("split").classList.add("on");
  $("cesiumContainer").style.width = "50%";
  $("cesiumContainer2").classList.add("on");

  // Labels follow the data actually in each pane. The left pane is always
  // the page you opened; the right pane is the other build.
  const isToday = DATA.model && DATA.model.scenario && DATA.model.scenario.type === "today";
  $("sll").textContent = isToday ? "Today" : "2017 survey";
  $("slr").textContent = isToday ? "2017 survey" : "Today";

  viewer2 = new Cesium.Viewer("cesiumContainer2", {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(
      Promise.resolve(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/" }))),
    animation:false, timeline:false, geocoder:false, homeButton:false,
    sceneModePicker:false, baseLayerPicker:false, navigationHelpButton:false,
    fullscreenButton:false, infoBox:false, selectionIndicator:false
  });
  viewer2.scene.globe.baseColor = Cesium.Color.fromCssColorString("#1d2129");
  viewer2.scene.globe.depthTestAgainstTerrain = true;
  viewer2.scene.fog.enabled = true;
  // One camera drives both panes. The right pane ignores mouse input, so the
  // two can never drift apart; you steer from the left.
  viewer2.scene.screenSpaceCameraController.enableInputs = false;

  const gj2 = { type: "FeatureCollection", features: DATA2.buildings.map((bd, i) => ({
    type: "Feature", id: i, properties: { height: bd.height, idx: i },
    geometry: { type: "Polygon", coordinates: [closeRing(bd.ring)] } })) };
  src2 = await Cesium.GeoJsonDataSource.load(gj2, { clampToGround: false });
  src2.entities.values.forEach(e => {
    const bd = DATA2.buildings[e.properties.idx.getValue()];
    e.polygon.extrudedHeight = bd.height;
    e.polygon.height = 0;
    e.polygon.outline = true;
    e.polygon.outlineColor = Cesium.Color.fromCssColorString("#0f1319").withAlpha(0.55);
  });
  await viewer2.dataSources.add(src2);
  src2.show = buildingSource ? buildingSource.show : true;

  syncCamera();
  removeSync = viewer.scene.postRender.addEventListener(syncCamera);
  await refreshSplit();

  const line = $("split-line");
  line.onpointerdown = e => { dragging = true; line.setPointerCapture(e.pointerId); };
  line.onpointerup = () => { dragging = false; };
  line.onpointermove = e => {
    if (!dragging) return;
    splitX = Math.max(0.15, Math.min(0.85, e.clientX / window.innerWidth));
    const pct = (splitX * 100).toFixed(1) + "%";
    line.style.left = pct;
    $("cesiumContainer").style.width = pct;
    $("cesiumContainer2").style.left = pct;
  };
}

let src2 = null, overlay2 = null, removeSync = null;

// The comparison pane is its own 3D scene, so it needs its own columns: the
// other year's felt heatmap, or the same change columns. A primitive cannot
// be shared between two scenes.
const colCache2 = new Map();
function updateColumns2() {
  if (!viewer2) return;
  const want = !!HEAT && isFelt() && showCols;
  const scen = isTodayBuild() ? "y2017" : "today";
  const lw = want && feltIsLocal() ? "w" : "";
  const key = !want ? null : activeLayer === "felt"
    ? `felt${lw}:${scen}:${heatSeason}:${heatStep}` : `chg${lw}:${heatSeason}:${heatStep}`;
  for (const [k, p] of colCache2) p.show = (k === key);
  if (!want || colCache2.has(key)) return;
  const fs = feltStep();
  if (activeLayer === "felt") {
    const vals = fs.felt2 && fs.felt2[scen];
    if (!vals || !HEAT.sections) return;
    colCache2.set(key, viewer2.scene.primitives.add(buildFeltHeatmap(vals)));
    return;
  }
  const cols = fs.cols;
  if (!cols || !cols.length) return;
  colCache2.set(key, viewer2.scene.primitives.add(buildColumns(cols)));
}

function syncCamera() {
  if (!viewer2) return;
  const c = viewer.camera;
  // Same vertical field of view on both sides. Cesium's fov is horizontal for
  // a wide viewer, so two panes of different width would show different
  // scales at the same camera position. Matching the vertical angle keeps one
  // metre the same size on screen in both panes, even with the divider moved.
  const fovy = c.frustum.fovy;
  const cv = viewer2.canvas;
  const a2 = cv.clientWidth / Math.max(1, cv.clientHeight);
  const fov2 = a2 >= 1 ? 2 * Math.atan(Math.tan(fovy / 2) * a2) : fovy;
  if (Math.abs(viewer2.camera.frustum.fov - fov2) > 1e-6) viewer2.camera.frustum.fov = fov2;
  viewer2.camera.setView({
    destination: Cesium.Cartesian3.clone(c.positionWC),
    orientation: { heading: c.heading, pitch: c.pitch, roll: c.roll }
  });
}

// Mirror whatever the controls show on the left: same day, same hour, same
// layer, same building colouring, same opacities. Both panes share one colour
// domain, so a colour means the same number on each side.
async function refreshSplit() {
  if (!viewer2 || !DATA2) return;
  const d2 = DATA2.days.find(x => x.id === day().id) || DATA2.days[0];
  let url, bs = DATA2.site.bounds;
  if (isWind()) {
    const w = windNow();
    const r = windRunFor(isTodayBuild() ? "2017" : "today", w.season, w.dir);
    url = r ? r.img : hstep().img.change;
    bs = HEAT.bounds;
  }
  else if (isHeat()) {
    // Both scenarios live in heat.json: the right pane shows the other year's
    // felt temperature, or the same change map.
    const im = feltStep().img;
    url = activeLayer === "change" ? im.change : (isTodayBuild() ? im.y2017 : im.today);
    bs = HEAT.bounds;
  }
  else if (activeLayer === "shade") url = d2.hours[Math.min(hourIndex, d2.hours.length - 1)].png;
  else if (activeLayer === "sunhours") url = d2.sunhours.png;
  else url = DATA2.svf ? DATA2.svf.png : d2.sunhours.png;
  const rect = Cesium.Rectangle.fromDegrees(bs.west, bs.south, bs.east, bs.north);
  const prov = Cesium.SingleTileImageryProvider.fromUrl
    ? await Cesium.SingleTileImageryProvider.fromUrl(url, { rectangle: rect })
    : new Cesium.SingleTileImageryProvider({ url, rectangle: rect });
  const next = viewer2.imageryLayers.addImageryProvider(prov);
  next.alpha = overlayAlpha();
  next.magnificationFilter = Cesium.TextureMagnificationFilter.NEAREST;
  if (overlay2) viewer2.imageryLayers.remove(overlay2, true);
  overlay2 = next;
  if (src2) {
    src2.show = buildingSource ? buildingSource.show : true;
    src2.entities.values.forEach(e => {
      e.polygon.material = buildingColour(DATA2.buildings[e.properties.idx.getValue()]);
    });
  }
  updateColumns2();
}

function stopSplit() {
  splitMode = false;
  $("tsplit").classList.remove("on");
  $("tsplit").textContent = "Compare 2017 vs today";
  $("split").classList.remove("on");
  $("cesiumContainer").style.width = "";
  $("cesiumContainer2").classList.remove("on");
  $("cesiumContainer2").style.left = "";
  $("split-line").style.left = "";
  if (removeSync) { removeSync(); removeSync = null; }
  if (viewer2) { viewer2.destroy(); viewer2 = null; }
  src2 = null; overlay2 = null; colCache2.clear();
}

start().catch(e => {
  console.error("startup failed:", e);
  $("boot").innerHTML = `<div class="inner">
    <div style="color:#ffb4a0;font-size:14px;margin-bottom:10px">
      Could not start the scene</div>
    <div style="color:#c2cad4;font-size:11.5px;line-height:1.6;text-align:left">
      ${describe(e)}</div>
    <div style="color:#5c646f;font-size:11px;margin-top:12px">
      Press F12 and open the Console tab for the full stack trace.</div>
  </div>`;
});
</script>
